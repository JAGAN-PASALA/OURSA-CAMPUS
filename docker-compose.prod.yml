name: ours-smart-classroom

x-app-environment: &app-environment
  APP_ENV: production
  SEED_DEMO_DATA: "false"
  APP_SECRET: ${APP_SECRET:?Set APP_SECRET in .env.production}
  BIOMETRIC_ENCRYPTION_KEY: ${BIOMETRIC_ENCRYPTION_KEY:?Set BIOMETRIC_ENCRYPTION_KEY in .env.production}
  MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:?Set MFA_ENCRYPTION_KEY in .env.production}
  DATABASE_URL: ${DATABASE_URL:?Set the URL-encoded MySQL DATABASE_URL in .env.production}
  REDIS_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env.production}@redis:6379/0
  DB_POOL_SIZE: "${DB_POOL_SIZE:-20}"
  DB_MAX_OVERFLOW: "${DB_MAX_OVERFLOW:-30}"
  OBJECT_STORAGE_ENDPOINT: http://minio:9000
  OBJECT_STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER}
  OBJECT_STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
  OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:-ours-private}
  OBJECT_STORAGE_SECURE: "false"
  CLAMAV_HOST: clamav
  CLAMAV_PORT: "3310"
  FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:?Set the public HTTPS portal URL}
  CORS_ORIGINS: ${CORS_ORIGINS:?Set the approved public HTTPS origin(s)}
  TRUSTED_HOSTS: ${TRUSTED_HOSTS:?Set approved production hostnames}
  SHARED_PORTAL_HOSTS: ${SHARED_PORTAL_HOSTS:?Set the shared portal hostname(s)}
  SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-ours_session}
  ACCESS_TOKEN_MINUTES: "${ACCESS_TOKEN_MINUTES:-480}"
  ALLOW_MODEL_DOWNLOADS: "false"
  SMTP_HOST: ${SMTP_HOST:?Set the production SMTP host}
  SMTP_PORT: "${SMTP_PORT:-587}"
  SMTP_USERNAME: ${SMTP_USERNAME:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:?Set the production sender address}
  SMTP_USE_TLS: "${SMTP_USE_TLS:-true}"
  REQUIRE_SMTP_IN_PRODUCTION: "true"
  CAMPUS_TIMEZONE: ${CAMPUS_TIMEZONE:-Asia/Kolkata}
  CAMERA_STREAMS_JSON: '${CAMERA_STREAMS_JSON:-[]}'
  CAMERA_FRAME_INTERVAL_SECONDS: "${CAMERA_FRAME_INTERVAL_SECONDS:-2}"
  CAMERA_HEALTH_TIMEOUT_SECONDS: "${CAMERA_HEALTH_TIMEOUT_SECONDS:-20}"
  CAMERA_RECONNECT_SECONDS: "${CAMERA_RECONNECT_SECONDS:-3}"
  ATTENDANCE_FINALIZE_GRACE_SECONDS: "${ATTENDANCE_FINALIZE_GRACE_SECONDS:-30}"
  SMS_ENABLED: "${SMS_ENABLED:-false}"
  WHATSAPP_ENABLED: "${WHATSAPP_ENABLED:-false}"
  TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
  TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
  TWILIO_SMS_FROM: ${TWILIO_SMS_FROM:-}
  TWILIO_WHATSAPP_FROM: ${TWILIO_WHATSAPP_FROM:-}
  PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-disabled}
  PAYMENT_CURRENCY: ${PAYMENT_CURRENCY:-INR}
  RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
  RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
  RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
  FCM_PROJECT_ID: ${FCM_PROJECT_ID:-}
  FCM_SERVICE_ACCOUNT_FILE: ${FCM_SERVICE_ACCOUNT_FILE:-}
  FCM_SERVICE_ACCOUNT_JSON: '${FCM_SERVICE_ACCOUNT_JSON:-}'
  FIREBASE_WEB_CONFIG: '${FIREBASE_WEB_CONFIG:-{}}'
  FIREBASE_VAPID_KEY: ${FIREBASE_VAPID_KEY:-}
  SMTP_USE_SSL: "${SMTP_USE_SSL:-false}"

services:
  redis:
    image: redis:8.2-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env.production}", "--appendonly", "yes", "--maxmemory-policy", "allkeys-lru"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env.production}
    volumes: [redis_data:/data]
    networks: [database]
    healthcheck:
      test: ["CMD-SHELL", 'redis-cli -a "$$REDIS_PASSWORD" ping | grep -q PONG']
      interval: 10s
      timeout: 3s
      retries: 10
    security_opt: ["no-new-privileges:true"]

  minio:
    image: rustfs/rustfs:latest
    restart: unless-stopped
    command: ["/data"]
    environment:
      RUSTFS_ACCESS_KEY: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER}
      RUSTFS_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
      RUSTFS_SSE_S3_MASTER_KEY: ${RUSTFS_SSE_S3_MASTER_KEY:?Set RUSTFS_SSE_S3_MASTER_KEY}
      RUSTFS_ADDRESS: "0.0.0.0:9000"
      RUSTFS_CONSOLE_ADDRESS: "0.0.0.0:9001"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_OBS_LOGGER_LEVEL: "info"
    volumes: [rustfs_data:/data]
    networks: [database]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s
    security_opt: ["no-new-privileges:true"]

  minio-init:
    image: amazon/aws-cli:2.38.6
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        printf '[default]\ns3 =\n  addressing_style = path\n' > "$$AWS_CONFIG_FILE"
        if aws --endpoint-url http://minio:9000 s3api head-bucket --bucket "$$OBJECT_STORAGE_BUCKET" >/dev/null 2>&1; then
          echo "Object-storage bucket already exists."
        else
          aws --endpoint-url http://minio:9000 s3api create-bucket --bucket "$$OBJECT_STORAGE_BUCKET"
        fi
    environment:
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
      AWS_DEFAULT_REGION: us-east-1
      AWS_CONFIG_FILE: /tmp/aws-config
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:-ours-private}
    networks: [database]

  clamav:
    image: clamav/clamav:1.4
    restart: unless-stopped
    volumes: [clamav_data:/var/lib/clamav]
    networks: [database]
    healthcheck:
      test: ["CMD", "/usr/local/bin/clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 90s
    security_opt: ["no-new-privileges:true"]

  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ours_classroom}
      MYSQL_USER: ${MYSQL_USER:-ours_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env.production}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env.production}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - mysql_data:/var/lib/mysql
    networks: [database]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    security_opt: ["no-new-privileges:true"]

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      clamav:
        condition: service_healthy
    environment:
      <<: *app-environment
      API_WORKERS: "${API_WORKERS:-1}"
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-172.16.0.0/12}
    expose: ["8000"]
    volumes:
      - backend_data:/app/data
      - ai_models:/app/models
    networks: [edge, database]
    healthcheck:
      test: ["CMD", "python", "-c", "from database import database_ready; import sys; sys.exit(0 if database_ready() else 1)"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 45s
    security_opt: ["no-new-privileges:true"]

  notifications:
    build: ./backend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      <<: *app-environment
    command: ["python", "notification_worker.py"]
    volumes:
      - backend_data:/app/data
    networks: [edge, database]
    security_opt: ["no-new-privileges:true"]

  camera-worker:
    profiles: [cameras]
    build: ./backend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      <<: *app-environment
    command: ["python", "camera_worker.py"]
    volumes:
      - backend_data:/app/data
      - ai_models:/app/models
    networks: [edge, database]
    security_opt: ["no-new-privileges:true"]

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        NEXT_PUBLIC_API_URL: ""
    restart: unless-stopped
    expose: ["5173"]
    networks: [edge]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:5173"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 30s
    security_opt: ["no-new-privileges:true"]

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    environment:
      PUBLIC_DOMAINS: ${PUBLIC_DOMAINS:?Set one or more comma-separated DNS names}
      ACME_EMAIL: ${ACME_EMAIL:?Set the certificate notification email}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [edge]
    security_opt: ["no-new-privileges:true"]

volumes:
  rustfs_data:

  mysql_data:
  backend_data:
  ai_models:
  redis_data:
  object_data:
  clamav_data:
  caddy_data:
  caddy_config:

networks:
  edge:
  database:
    internal: true
